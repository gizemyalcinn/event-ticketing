services:
  db:
    image: postgres:16
    container_name: event_ticketing_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    container_name: event_ticketing_app
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: tail -f /dev/null
volumes:
  pgdata:
